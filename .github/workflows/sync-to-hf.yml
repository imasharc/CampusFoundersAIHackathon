name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "am0@tutamail.com"
          git config --global user.name "imasharc"
          git clone https://imasharc:$HF_TOKEN@huggingface.co/spaces/imasharc/cfhackathon hf-space
          cp pipeline.py server.py index.html Dockerfile hf-space/
          cd hf-space
          git add .
          git diff --staged --quiet || git commit -m "sync from GitHub: ${{ github.event.head_commit.message }}"
          git push